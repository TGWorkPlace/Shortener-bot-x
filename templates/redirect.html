<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!--
  ARCHITECTURE NOTE (unchanged from prior version):
  This page intentionally does NOT contain a <meta http-equiv="refresh">
  pointing at the destination, and does NOT contain the destination URL
  anywhere in the markup, CSS, or JavaScript below.

  The only backend-provided value on this page is the short "code" itself
  (e.g. "A28UO"), which is already public knowledge -- it's the code the
  visitor typed/clicked to get here. The actual destination URL is never
  sent to the browser until the moment the browser is redirected: the
  countdown and the button both simply navigate to "/r/<code>", a SECOND
  endpoint which looks the code up server-side and issues an HTTP 302
  redirect straight to the destination. The destination therefore never
  appears in this document's source, in any inline script, or in any
  JSON blob embedded in the page.

  UI REDESIGN NOTE: everything below is a visual-only pass. The countdown
  logic, timing, and redirect call in the <script> block at the bottom
  are untouched byte-for-byte. All new motion (the progress ring, card
  entrance, button micro-interactions) is driven independently by CSS,
  hard-coded to the same 5-second duration as the existing JS timer, so
  nothing here needs to read from or write to the redirect script.
-->
<title>Redirecting…</title>
<style>
  /* ---------------------------------------------------------------
     Design tokens
     Palette: clean white field with a signature green accent.
     ----------------------------------------------------------------
     --bg-white     #FFFFFF  page background
     --green        #16A34A  signature accent (ring + button)
     --green-strong #15803D  gradient end / active state
     --green-soft   rgba(22,163,74,0.10)  tints & glows
     --ink          #111827  primary text
     --ink-muted    #6B7280  secondary text
     --ink-on-green #FFFFFF  text placed on top of green (contrast)
     --card-bg      #FFFFFF  card surface
     --card-brd     rgba(17,24,39,0.08)  card border
     --------------------------------------------------------------- */
  :root {
    --bg-white: #FFFFFF;
    --green: #16A34A;
    --green-strong: #15803D;
    --green-soft: rgba(22, 163, 74, 0.10);
    --ink: #111827;
    --ink-muted: #6B7280;
    --ink-on-green: #FFFFFF;
    --card-bg: #FFFFFF;
    --card-brd: rgba(17, 24, 39, 0.08);
    --ring-size: 132px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh; /* correct viewport height inside Telegram's in-app browser */
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(ellipse 70% 55% at 15% -10%, var(--green-soft), transparent 60%),
      radial-gradient(ellipse 65% 50% at 105% 105%, rgba(22, 163, 74, 0.08), transparent 60%),
      var(--bg-white);
    background-attachment: fixed;
  }

  /* Ambient decorative glows sitting behind the card. Purely cosmetic,
     hidden from assistive tech, and inert (no interaction). */
  .backdrop-decor {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .backdrop-decor span {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.5;
  }
  .backdrop-decor span:nth-child(1) {
    width: 340px;
    height: 340px;
    top: -120px;
    left: -80px;
    background: var(--green);
    opacity: 0.08;
  }
  .backdrop-decor span:nth-child(2) {
    width: 420px;
    height: 420px;
    bottom: -160px;
    right: -120px;
    background: var(--green);
    opacity: 0.06;
  }

  .stage {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
  }

  .card {
    width: 100%;
    max-width: 400px;
    text-align: center;
    padding: 40px 32px 34px;
    border-radius: 28px;
    background: var(--card-bg);
    border: 1px solid var(--card-brd);
    box-shadow:
      0 30px 60px -24px rgba(17, 24, 39, 0.18),
      0 1px 0 rgba(255, 255, 255, 0.6) inset;
    animation: card-enter 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes card-enter {
    from {
      opacity: 0;
      transform: translateY(18px) scale(0.97);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .eyebrow {
    margin: 0 0 10px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--green);
  }

  .headline {
    margin: 0 0 28px;
    font-family: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-weight: 600;
    font-size: 26px;
    line-height: 1.25;
    letter-spacing: 0.01em;
    color: var(--ink);
  }

  /* --- Circular progress ring ---------------------------------------
     Pure CSS/SVG animation, hard-coded to 5s to match the JS timer's
     starting value. It does not read the JS countdown; it is a visual
     companion running in parallel, not a controller of the redirect. */
  .ring-wrap {
    position: relative;
    width: var(--ring-size);
    height: var(--ring-size);
    margin: 0 auto 24px;
  }

  .ring {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .ring-track {
    fill: none;
    stroke: rgba(17, 24, 39, 0.08);
    stroke-width: 7;
  }

  .ring-progress {
    fill: none;
    stroke: var(--green);
    stroke-width: 7;
    stroke-linecap: round;
    stroke-dasharray: 339.29;
    stroke-dashoffset: 0;
    filter: drop-shadow(0 0 6px rgba(22, 163, 74, 0.45));
    animation: ring-countdown 5s linear forwards;
  }

  @keyframes ring-countdown {
    from { stroke-dashoffset: 0; }
    to { stroke-dashoffset: 339.29; }
  }

  .count-display {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .count-display #count {
    font-size: 40px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: var(--ink);
  }

  .count-label {
    margin-top: 2px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .status-text {
    margin: 0 0 28px;
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--ink-muted);
  }

  .btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    background: linear-gradient(135deg, var(--green) 0%, var(--green-strong) 100%);
    color: var(--ink-on-green);
    text-decoration: none;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.01em;
    padding: 16px 28px;
    border-radius: 999px;
    box-shadow:
      0 12px 28px -8px rgba(22, 163, 74, 0.45),
      0 1px 0 rgba(255, 255, 255, 0.25) inset;
    transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow:
      0 16px 34px -8px rgba(22, 163, 74, 0.55),
      0 1px 0 rgba(255, 255, 255, 0.3) inset;
  }

  .btn:active {
    transform: translateY(0);
    filter: brightness(0.97);
  }

  /* Visible keyboard focus ring, kept distinct from the hover state
     so keyboard users always get a clear indicator. */
  .btn:focus-visible {
    outline: 3px solid var(--green-strong);
    outline-offset: 3px;
  }

  .btn svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    transition: transform 0.18s ease;
  }

  .btn:hover svg {
    transform: translateX(3px);
  }

  .fine-print {
    margin: 20px 0 0;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--ink-muted);
    opacity: 0.9;
  }

  /* Respect reduced-motion preferences: keep the page fully functional,
     just remove the decorative motion. */
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .ring-progress { animation: none; stroke-dashoffset: 170; }
    .btn, .btn svg { transition: none; }
  }

  @media (max-width: 380px) {
    .card { padding: 32px 22px 28px; }
    .headline { font-size: 22px; }
    :root { --ring-size: 116px; }
  }
</style>
</head>
<body>
  <div class="backdrop-decor" aria-hidden="true">
    <span></span>
    <span></span>
  </div>

  <main class="stage">
    <section class="card" aria-labelledby="heading">
      <p class="eyebrow">Secure Redirect</p>
      <h1 id="heading" class="headline">Taking you there</h1>

      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring-track" cx="60" cy="60" r="54"></circle>
          <circle class="ring-progress" cx="60" cy="60" r="54"></circle>
        </svg>
        <div class="count-display">
          <!-- aria-live intentionally off: a number changing once per
               second would be announced repeatedly and is disruptive
               for screen reader users. The static text below already
               communicates what's happening. -->
          <span id="count" aria-live="off">5</span>
          <span class="count-label">sec</span>
        </div>
      </div>

      <p class="status-text" role="status">Redirecting automatically, or continue right away.</p>

      <!--
        This href points at OUR OWN resolve endpoint ("/r/<code>"), never at
        the destination. Clicking it triggers a normal browser navigation
        request; the server resolves the code and responds with a 302
        redirect to the real destination only at that point.
      -->
      <a class="btn" id="openLink" href="/r/__CODE__">
        <span>Open Now</span>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <p class="fine-print">You'll be redirected securely. If nothing happens, tap the button above.</p>
    </section>
  </main>

  <script>
    (function () {
      // Only the short code is known to this script -- NOT the destination
      // URL. The code is not secret (it's already visible in this page's
      // own URL path), so embedding it here leaks nothing new.
      var code = "__CODE__";
      var resolveUrl = "/r/" + encodeURIComponent(code);
      var seconds = 5;
      var countEl = document.getElementById("count");

      var timer = setInterval(function () {
        seconds -= 1;
        if (seconds <= 0) {
          clearInterval(timer);
          // Navigate to our backend resolve endpoint. The browser only
          // ever reaches the destination URL because THAT request gets a
          // 3xx redirect response from the server -- the destination is
          // never present in this page's JavaScript, DOM, or network
          // payload up to this point.
          window.location.replace(resolveUrl);
          return;
        }
        countEl.textContent = seconds;
      }, 1000);
    })();
  </script>
</body>
</html>
